<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Factory | SEIBORLANG GAMAX PROJECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* MINECRAFT 3D AESTHETIC CSS */
        :root {
            --mc-bg: #5c5c5c;
            --mc-dirt: #866043;
            --mc-grass: #4e7a27;
            --mc-stone: #8b8b8b;
            --mc-stone-light: #ffffff;
            --mc-stone-dark: #373737;
            --mc-stone-shadow: #5a5a5a;
        }

        body {
            background-color: var(--mc-bg);
            background-image: repeating-linear-gradient(45deg, #505050 25%, transparent 25%, transparent 75%, #505050 75%, #505050), repeating-linear-gradient(45deg, #505050 25%, #5c5c5c 25%, #5c5c5c 75%, #505050 75%, #505050);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            font-family: 'Press Start 2P', monospace;
            color: white;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
            overflow-x: hidden; /* Prevent scrollbar from animations */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* 3D Block Container Style */
        .mc-panel {
            background-color: var(--mc-stone);
            border: 6px solid var(--mc-stone-dark);
            border-top-color: var(--mc-stone-light);
            border-left-color: var(--mc-stone-light);
            box-shadow: inset -6px -6px 0px 0px var(--mc-stone-shadow), 10px 10px 0px rgba(0,0,0,0.5);
            padding: 30px;
            margin-bottom: 30px;
            color: #000;
        }

        .header-panel {
            text-align: center;
            background-color: var(--mc-dirt);
            border-bottom: 15px solid var(--mc-grass);
            color: white;
            text-shadow: 2px 2px 0px #000;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .credits {
            font-size: 10px;
            color: #ffffaa;
            margin-top: 15px;
            line-height: 1.8;
        }

        /* Search Bar Section */
        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }

        #searchInput {
            width: 80%;
            max-width: 600px;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            background-color: #000;
            color: #55ff55;
            border: 4px solid var(--mc-stone-light);
            border-bottom-color: var(--mc-stone-dark);
            border-right-color: var(--mc-stone-dark);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            outline: none;
        }

        #searchInput::placeholder {
            color: #44aa44;
        }

        /* Animated Step-by-Step Box */
        .tutorial-box {
            background-color: #000;
            color: #55ff55;
            padding: 20px;
            border: 4px solid #fff;
            min-height: 80px;
            font-size: 12px;
            margin-bottom: 30px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
        }

        /* Prompt Grid */
        .prompt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .prompt-card {
            background-color: #fff;
            padding: 20px;
            border: 4px solid var(--mc-stone-dark);
            border-top-color: var(--mc-stone-light);
            border-left-color: var(--mc-stone-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .prompt-card:hover {
            transform: scale(1.02);
        }

        .prompt-category {
            background: #000;
            color: #fff;
            padding: 8px 12px;
            font-size: 10px;
            display: inline-block;
            margin-bottom: 15px;
            align-self: flex-start;
            border: 2px solid #555;
        }

        .prompt-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            background: #eee;
            color: #222;
            padding: 15px;
            border: 2px solid #ccc;
            margin-bottom: 15px;
            font-weight: bold;
            flex-grow: 1;
            max-height: 200px;
            overflow-y: auto;
        }

        /* 3D Button */
        .mc-button {
            background-color: var(--mc-stone);
            border: 4px solid var(--mc-stone-dark);
            border-top-color: var(--mc-stone-light);
            border-left-color: var(--mc-stone-light);
            box-shadow: inset -4px -4px 0px 0px var(--mc-stone-shadow);
            color: #000;
            font-family: 'Press Start 2P', monospace;
            padding: 15px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all 0.1s;
        }

        .mc-button:active {
            border-top-color: var(--mc-stone-dark);
            border-left-color: var(--mc-stone-dark);
            border-bottom-color: var(--mc-stone-light);
            border-right-color: var(--mc-stone-light);
            box-shadow: inset 4px 4px 0px 0px var(--mc-stone-shadow);
            transform: translateY(4px);
        }

        .mc-button.copied {
            background-color: var(--mc-grass);
            color: white;
            text-shadow: 2px 2px 0px #000;
        }

        /* NO RESULTS MESSAGE */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 16px;
            color: #ff5555;
            background: #000;
            padding: 30px;
            border: 4px solid #fff;
        }

        /* --- ANIMATED CHARACTERS --- */
        .character {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 1; /* Behind content */
            opacity: 0.8;
            pointer-events: none;
        }

        /* Creeper Face */
        .creeper {
            top: 20%;
            left: -100px;
            background-color: #55ff55;
            box-shadow: inset 0 0 10px #00aa00;
            animation: walkRight 25s linear infinite;
        }
        .creeper::before {
            content: "";
            position: absolute;
            top: 15px; left: 10px; width: 12px; height: 12px; background: #000;
            box-shadow: 28px 0 0 #000, 14px 14px 0 #000, 14px 22px 0 #000, 14px 30px 0 #000, 6px 30px 0 #000, 22px 30px 0 #000;
        }

        /* Steve Face */
        .steve {
            bottom: 15%;
            right: -100px;
            background-color: #dcb38c;
            box-shadow: inset 0 0 10px #866043;
            animation: walkLeft 30s linear infinite;
        }
        .steve::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 60px; height: 12px; background: #4a3018; /* Hair */
            box-shadow: 0 12px 0 #4a3018, -20px 12px 0 #4a3018; 
        }
        .steve::after {
            content: "";
            position: absolute;
            top: 25px; left: 10px; width: 8px; height: 8px; background: #fff; /* Eyes */
            box-shadow: 4px 0 0 #3b3bcf, 32px 0 0 #fff, 36px 0 0 #3b3bcf, 16px 15px 0 #7b4a32, 20px 15px 0 #7b4a32, 16px 20px 0 #4a3018, 20px 20px 0 #4a3018; 
        }

        @keyframes walkRight {
            0% { transform: translateX(-100px) translateY(0) rotate(0deg); }
            25% { transform: translateX(25vw) translateY(-20px) rotate(5deg); }
            50% { transform: translateX(50vw) translateY(0) rotate(-5deg); }
            75% { transform: translateX(75vw) translateY(-20px) rotate(5deg); }
            100% { transform: translateX(120vw) translateY(0) rotate(0deg); }
        }

        @keyframes walkLeft {
            0% { transform: translateX(100px) translateY(0) rotate(0deg); }
            25% { transform: translateX(-25vw) translateY(-15px) rotate(-5deg); }
            50% { transform: translateX(-50vw) translateY(0) rotate(5deg); }
            75% { transform: translateX(-75vw) translateY(-15px) rotate(-5deg); }
            100% { transform: translateX(-120vw) translateY(0) rotate(0deg); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 18px; }
            .prompt-grid { grid-template-columns: 1fr; }
            #searchInput { width: 90%; }
        }
    </style>
</head>
<body>

    <div class="character creeper"></div>
    <div class="character steve"></div>

    <div class="container">
        <div class="mc-panel header-panel">
            <h1>PROMPT FACTORY</h1>
            <p>Transform Real Photos into Aesthetic Masterpieces</p>
            <div class="credits">
                [ credit goes to, ( prompt factory free source ) ]<br><br>
                [ made by seiborlang gamax project ft BIBERLY coded ]
            </div>
        </div>

        <div class="tutorial-box" id="tutorial-text">
            </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="SEARCH PROMPTS (e.g. Cyberpunk, Fashion, Dark...)">
        </div>

        <div class="prompt-grid" id="prompt-container">
            </div>
    </div>

    <script>
        // --- 1. ANIMATED STEP-BY-STEP TUTORIAL ---
        const steps = [
            "SYSTEM INITIALIZED...",
            "> STEP 1: Search or browse the 100+ aesthetic & cinematic prompts below.",
            "> STEP 2: Click the 'COPY PROMPT' block to save to clipboard.",
            "> STEP 3: Paste it into your AI generator (Midjourney, Flux, ChatGPT, etc).",
            "> STEP 4: Replace [SUBJECT] with your own image prompt or description.",
            "> STEP 5: Generate and witness the magic! >> READY."
        ];
        
        let stepIndex = 0;
        let charIndex = 0;
        const speed = 35; 
        const tutorialElement = document.getElementById("tutorial-text");

        function typeWriter() {
            if (stepIndex < steps.length) {
                if (charIndex < steps[stepIndex].length) {
                    tutorialElement.innerHTML += steps[stepIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, speed);
                } else {
                    tutorialElement.innerHTML += "<br><br>";
                    stepIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 400); 
                }
            }
        }
        
        window.onload = typeWriter;

        // --- 2. PROMPT DATABASE (100+ UNIQUE VIRAL PROMPTS) ---
        // Base arrays for dynamic generation to ensure 100+ diverse, high-quality prompts
        const basePrompts = [
            { category: "Cinematic Realism", text: "A highly detailed, hyper-realistic cinematic portrait of [SUBJECT], illuminated by neon cyberpunk streetlights, 8k resolution, Unreal Engine 5 render, shot on 35mm lens, shallow depth of field, dramatic moody shadows, photorealistic, masterpiece." },
            { category: "Digital Trendy", text: "Vaporwave aesthetic of [SUBJECT], glowing wireframe in a retro-futuristic grid landscape, neon pink and cyan color palette, synthwave style, digital art, highly detailed, trending on ArtStation, 80s arcade vibe." },
            { category: "Dark Fantasy", text: "A dark fantasy illustration of [SUBJECT] wearing ornate, ancient gothic armor, standing in a misty, ruined cathedral. Ethereal lighting, volumetric fog, concept art, masterpiece, Greg Rutkowski style, grimdark atmosphere." },
            { category: "Studio Ghibli", text: "A 1990s anime style screenshot of [SUBJECT], Studio Ghibli style, vibrant lush green colors, nostalgic atmosphere, highly detailed cel-shaded animation, soft volumetric lighting, beautiful anime background." },
            { category: "Cyberpunk 2077", text: "[SUBJECT] as a futuristic cyberpunk street mercenary, wearing high-tech streetwear with glowing LED accents, rainy neon-lit Tokyo alleyway background, reflections in puddles, cinematic lighting, 8k octane render." },
            { category: "Ethereal Pastel", text: "An ethereal, soft pastel portrait of [SUBJECT], surrounded by glowing bioluminescent butterflies and floating glowing dust. Dreamy atmosphere, light pink and soft blue hues, incredibly delicate details, magical realism." },
            { category: "Vintage Film", text: "A vintage 1970s polaroid photo of [SUBJECT], slightly faded colors, light leaks, film grain, nostalgic summer vibe, candid photography, highly aesthetic, warm golden hour lighting." },
            { category: "Origami Paper Art", text: "Macro photography of [SUBJECT] made entirely of intricate folded origami paper, illuminated by soft studio lighting, sharp focus on paper textures, pastel background, minimalist and aesthetic." },
            { category: "Steampunk", text: "[SUBJECT] in a detailed steampunk aesthetic, brass goggles, leather attire, intricate clockwork mechanisms, copper pipes, sepia-toned industrial Victorian background, cinematic concept art." },
            { category: "Holographic", text: "A futuristic holographic projection of [SUBJECT] floating in mid-air inside a dark, minimalist high-tech room. Iridescent colors, glowing data streams, translucent glitches, 3D hologram aesthetic." },
            { category: "Fashion & Streetwear", text: "High-fashion editorial photography of [SUBJECT] wearing avant-garde luxury streetwear. Oversized silhouette, metallic textures, posing against a brutalist concrete architecture background. Shot on medium format camera, sharp focus, Vogue magazine aesthetic." },
            { category: "Anime Style Scene", text: "Epic shonen anime battle scene featuring [SUBJECT] surrounded by glowing energy auras and shattered ground. Dynamic wide-angle perspective, intense action lines, vibrant colors, Ufotable animation style, 4k resolution." },
            { category: "AI Influencer", text: "Hyper-realistic candid Instagram photo of [SUBJECT] as a stylish AI influencer sitting in a chic Parisian cafe. Natural sunlight, depth of field, casual luxury outfit, trendy aesthetics, shot on iPhone 15 Pro, highly detailed face." },
            { category: "Dark Aesthetic Edit", text: "Moody dark academia aesthetic portrait of [SUBJECT] reading an ancient grimoire in a candlelit library. Deep shadows, rich mahogany and gold tones, cinematic chiaroscuro lighting, mysterious vibe, 8k resolution." },
            { category: "Neon Lighting Effects", text: "[SUBJECT] illuminated solely by vibrant ultraviolet and neon green blacklights. Glowing body paint, dark room, high contrast, futuristic rave aesthetic, incredibly sharp facial details, 85mm portrait lens." },
            { category: "Dreamy Nature", text: "Surreal landscape photography featuring [SUBJECT] standing in an endless field of giant glowing lavender flowers under a starry galaxy sky. Bioluminescence, dreamy atmosphere, National Geographic style, ultra-detailed." },
            { category: "Luxury Lifestyle", text: "[SUBJECT] leaning against a sleek matte-black hypercar in front of a modern glass mansion at sunset. Wealthy lifestyle aesthetic, cinematic golden hour lighting, sharp reflections, luxury commercial photography." },
            { category: "Korean Aesthetic", text: "Soft Korean cafe aesthetic photo of [SUBJECT]. Minimalist beige and white tones, soft natural window light, aesthetic coffee cup, clean composition, K-drama poster style, highly aesthetic." },
            { category: "Sci-Fi Environment", text: "Cinematic wide shot of [SUBJECT] exploring an alien megacity with massive floating holographic billboards and flying vehicles. Ridley Scott style, dystopian sci-fi environment, hyper-detailed 3D environment." },
            { category: "Action Scene", text: "High-octane action photography of [SUBJECT] jumping through a shattered glass window. Slow-motion cinematic effect, flying glass shards reflecting light, dramatic explosion in the background, Hollywood blockbuster style." },
            { category: "Gaming Redesign", text: "[SUBJECT] redesigned as an epic MMORPG final boss. Intricate dark magic armor, glowing red eyes, wielding a massive cursed broadsword. Concept art, ArtStation trending, extreme detail, dark fantasy." },
            { category: "Movie Poster", text: "Official movie poster featuring [SUBJECT] in an intense sci-fi thriller. Bold dramatic lighting, intense facial expression, cinematic color grading with teal and orange cinematic LUTs, title safe area, hyper-realistic." },
            { category: "Creative PFP", text: "A stunningly creative profile picture of [SUBJECT]. Half human, half starry nebula. Cosmic transition effect, vibrant purple and pink galaxies, circular composition, minimalist background, perfect for Discord or Instagram PFP." },
            { category: "TikTok Viral Style", text: "Trendy Y2K aesthetic edit of [SUBJECT], fisheye lens perspective, flash photography, sparkly glitter filter effects, bold fashion, 2000s nostalgia vibe, highly stylized." },
            { category: "Minimalist Modern", text: "Ultra-minimalist modern art portrait of [SUBJECT]. Harsh geometric shadows, stark white background, single pop of vibrant red color on the outfit, high fashion editorial, clean lines." },
            { category: "Rain & Night City", text: "Cinematic moody photography of [SUBJECT] standing in the pouring rain under a red neon sign. Wet reflections on the asphalt, cinematic grain, moody atmosphere, Wong Kar-wai film aesthetic." },
            { category: "Surreal Artistic", text: "Surrealist masterpiece of [SUBJECT] where their head is dissolving into a flock of black ravens. Salvador Dali inspired, desert background, dreamlike physics, mind-bending visual, high resolution." },
            { category: "3D Render", text: "Cute isometric 3D render of [SUBJECT] in a miniature cozy bedroom diorama. Claymation texture, soft global illumination, Blender cycles render, pastel color palette, incredibly detailed." },
            { category: "AI Wallpaper", text: "Breathtaking ultra-wide 16:9 desktop wallpaper of [SUBJECT] standing atop a snowy mountain overlooking a massive glowing ringed planet in the sky. Epic scale, cinematic lighting, 8k resolution, photorealistic." },
            { category: "Fantasy + Futuristic", text: "Cyber-elf hybrid concept art of [SUBJECT]. Pointy ears, medieval elven robes fused with glowing cybernetic implants and robotic limbs. High tech meets high fantasy, Unreal Engine 5 render, intricate details." }
        ];

        // Dynamic generation to hit 100+ unique, high-quality prompts
        const modifiers = [
            "Shot on RED Monstro 8K, cinematic lighting.",
            "Volumetric fog, dramatic god rays.",
            "Trending on ArtStation, masterpiece, highly detailed.",
            "Unreal Engine 5 render, ray tracing enabled.",
            "Award-winning photography, National Geographic style.",
            "Intense chiaroscuro lighting, deep shadows.",
            "Vibrant color grading, hyper-realistic textures."
        ];
        
        const extraCategories = ["Fashion & Stylish", "Luxury Outfits", "Cinematic Portraits", "Dark Edits", "Anime Styles", "Futuristic Visuals", "Glowing Effects", "Hyper-Detailed"];

        const allPrompts = [...basePrompts];

        // Generate additional unique prompts up to 105
        let modifierIndex = 0;
        let catIndex = 0;
        for (let i = basePrompts.length; i < 105; i++) {
            const base = basePrompts[i % basePrompts.length];
            const mod = modifiers[modifierIndex % modifiers.length];
            const cat = extraCategories[catIndex % extraCategories.length];
            
            allPrompts.push({
                category: cat + " Vol." + (Math.floor(i/10)),
                text: `${base.text} ${mod} Ultra-high resolution, perfect anatomy, 8k.`
            });
            
            modifierIndex++;
            catIndex++;
        }

        // --- 3. RENDER PROMPTS TO HTML ---
        const container = document.getElementById("prompt-container");
        const searchInput = document.getElementById("searchInput");

        function renderPrompts(promptsToRender) {
            container.innerHTML = ""; // Clear current

            if (promptsToRender.length === 0) {
                const noRes = document.createElement("div");
                noRes.className = "no-results";
                noRes.innerText = "NO PROMPTS FOUND. TRY ANOTHER SEARCH TERM.";
                container.appendChild(noRes);
                return;
            }

            promptsToRender.forEach((prompt, index) => {
                const card = document.createElement("div");
                card.className = "prompt-card mc-panel";
                card.style.padding = "20px";
                card.style.marginBottom = "0px"; 

                const category = document.createElement("div");
                category.className = "prompt-category";
                category.innerText = prompt.category;

                const text = document.createElement("div");
                text.className = "prompt-text";
                text.innerText = prompt.text;
                text.id = `prompt-${index}`;

                const btn = document.createElement("button");
                btn.className = "mc-button";
                btn.innerText = "COPY PROMPT";
                
                btn.onclick = function() {
                    navigator.clipboard.writeText(prompt.text).then(() => {
                        btn.innerText = "COPIED!";
                        btn.classList.add("copied");
                        setTimeout(() => {
                            btn.innerText = "COPY PROMPT";
                            btn.classList.remove("copied");
                        }, 2000); 
                    });
                };

                card.appendChild(category);
                card.appendChild(text);
                card.appendChild(btn);
                container.appendChild(card);
            });
        }

        // Initial render
        renderPrompts(allPrompts);

        // --- 4. SEARCH FUNCTIONALITY ---
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredPrompts = allPrompts.filter(p => 
                p.category.toLowerCase().includes(searchTerm) || 
                p.text.toLowerCase().includes(searchTerm)
            );
            renderPrompts(filteredPrompts);
        });

    </script>
</body>
</html>
